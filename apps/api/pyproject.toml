[project]
name = "open-tts-desktop-api"
version = "0.1.0"
description = "Local API gateway for open-source TTS desktop app"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "starlette==1.2.1",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.20",
  "websockets>=13.0",
  "numpy==1.26.4",
  "onnxruntime==1.23.2",
  "qrcode[pil]>=7.4.2",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
