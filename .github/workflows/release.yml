name: Release Windows client

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test, package, and publish
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies
        shell: pwsh
        run: |
          python -m venv apps/api/.venv
          .\apps\api\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\apps\api\.venv\Scripts\python.exe -m pip install -e .\apps\api

      - name: Test local API
        shell: pwsh
        working-directory: apps/api
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test desktop build and Electron runtime helpers
        working-directory: apps/desktop
        run: |
          npm run build
          npm run test:electron

      - name: Require a matching release tag
        shell: pwsh
        run: |
          $package = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' must match apps/desktop/package.json version '$expectedTag'."
          }

      - name: Package Windows installer and portable build
        working-directory: apps/desktop
        run: npm run package:ci

      - name: Upload release build for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTTS-Studio-${{ github.ref_name }}-windows
          path: apps/desktop/release/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            apps/desktop/release/OpenTTS-Studio-Setup-*-x64.exe
            apps/desktop/release/OpenTTS-Studio-Setup-*-x64.exe.blockmap
            apps/desktop/release/OpenTTS-Studio-Portable-*-x64.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/OpenTTS-Studio-*-checksums.txt
