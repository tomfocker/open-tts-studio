name: Verify desktop changes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test local API and desktop
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install and test local API
        shell: pwsh
        run: |
          python -m venv apps/api/.venv
          .\apps\api\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\apps\api\.venv\Scripts\python.exe -m pip install -e .\apps\api
          Push-Location apps/api
          .\.venv\Scripts\python.exe -m pytest -q
          Pop-Location

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install and test desktop
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          npm run test:electron
